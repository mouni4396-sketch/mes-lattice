<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step Ontology & Relations - Critical Manufacturing MES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="vis-network.min.js"></script>
    <style>
        :root {
            --bg-primary: #080b11;
            --bg-secondary: #0e131f;
            --card-bg: rgba(18, 26, 47, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --color-core: #8b5cf6;
            --color-subclass: #a78bfa;
            --color-related: #10b981;
            --color-operation: #f97316;
            --accent-blue: #3b82f6;
            --shadow-neon: 0 0 25px rgba(139, 92, 246, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.07) 0px, transparent 50%);
        }
        header {
            padding: 1.25rem 2.5rem;
            border-bottom: 1px solid var(--card-border);
            background: rgba(8, 11, 17, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand p { font-size: 0.8rem; color: var(--text-secondary); }
        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .main-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            flex-grow: 1;
            height: calc(100vh - 78px);
            min-height: 0;
            position: relative;
        }
        #networkContainer {
            width: 100%;
            height: 100%;
            background-color: rgba(8, 11, 17, 0.5);
            position: relative;
            overflow: hidden;
        }
        .overlay-panel {
            position: absolute;
            left: 2rem;
            bottom: 2rem;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            pointer-events: none;
        }
        .legend-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
        }
        .legend-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }
        .legend-items { display: flex; flex-direction: column; gap: 0.5rem; }
        .legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
        .legend-color { width: 12px; height: 12px; border-radius: 4px; }
        .inspector-panel {
            border-left: 1px solid var(--card-border);
            background: rgba(14, 19, 31, 0.85);
            backdrop-filter: blur(20px);
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.4);
            z-index: 5;
        }
        .inspector-header {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1rem;
        }
        .node-type-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            width: fit-content;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
        }
        .badge-core { background: rgba(139, 92, 246, 0.15); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.3); }
        .badge-related { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-operation { background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
        .node-title { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 600; color: white; margin-top: 0.5rem; }
        .node-description { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5; }
        .info-section { display: flex; flex-direction: column; gap: 0.75rem; }
        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.35rem;
        }
        .prop-item {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            padding: 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .prop-name { font-weight: 600; color: white; }
        .prop-val { color: var(--text-secondary); }
        .op-meta-card {
            background: rgba(249, 115, 22, 0.05);
            border: 1px solid rgba(249, 115, 22, 0.15);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .op-lock { display: flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: #fb923c; font-weight: 600; }
        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; grid-template-rows: 500px auto; height: auto; overflow-y: auto; }
            body { overflow: auto; }
            .inspector-panel { border-left: none; border-top: 1px solid var(--card-border); }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <h1>Step Ontology & Relations</h1>
            <p>Critical Manufacturing MES Domain Schema Model</p>
        </div>
        <a class="back-btn" href="index.html">➔ Back to Directory</a>
    </header>
    <div class="main-container">
        <div id="networkContainer">
            <div class="overlay-panel">
                <div class="legend-card">
                    <h3 class="legend-title">Entity / Node Types</h3>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: var(--color-core); box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);"></div>
                            <span>Core Entity Class</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: var(--color-related); box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);"></div>
                            <span>Related Domain Class</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background-color: var(--color-operation); box-shadow: 0 0 10px rgba(249, 115, 22, 0.4);"></div>
                            <span>Entity Transaction (Op)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="inspector-panel" id="inspector"></div>
    </div>
    <script>
        const ontologyData = {
            classes: {"Step": {"type": "core_class", "title": "Step", "description": "\ud83d\udd12 Step.Show", "properties": [{"name": "Name", "value": "String (Unique identifier)"}, {"name": "Description", "value": "String (Optional description)"}], "associations": []}},
            operations: {"CloneStep": {"type": "operation", "title": "Clone Step", "description": "\ud83d\udd12 Step.Clone", "security": ["Step.Clone Overview#"], "preconditions": [], "steps": []}, "CreateStep": {"type": "operation", "title": "Create Step", "description": "\ud83d\udd12 Step.Create", "security": ["Step.Create", "Step.CreateTemplate", "Step.CreateFromTemplate Overview#"], "preconditions": [], "steps": []}, "EditStep": {"type": "operation", "title": "Edit Step", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageAreas": {"type": "operation", "title": "Manage Areas", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageCosts": {"type": "operation", "title": "Manage Costs", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageFutureActions": {"type": "operation", "title": "Manage Future Actions", "description": "\ud83d\udd12 Step.ManageFutureActions", "security": ["Step.ManageFutureActions Overview#"], "preconditions": [], "steps": []}, "ManageInspectionInformation": {"type": "operation", "title": "Manage Inspection Information", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageInspectionSeverityInstances": {"type": "operation", "title": "Manage Step Inspection Severity Instances", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageReasons": {"type": "operation", "title": "Manage Reasons", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageSampling": {"type": "operation", "title": "Manage Sampling Plans", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageStepLogicalNames": {"type": "operation", "title": "Manage Step Logical Names", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "ManageStepScheduling": {"type": "operation", "title": "Manage Scheduling", "description": "\ud83d\udd12 Step.Edit", "security": ["Step.Edit Overview#"], "preconditions": [], "steps": []}, "SpecialManageFutureActions": {"type": "operation", "title": "Special Manage Future Actions", "description": "\ud83d\udd12 Step.SpecialManageFutureActions", "security": ["Step.SpecialManageFutureActions Overview#"], "preconditions": [], "steps": []}, "StepInspectionRules": {"type": "operation", "title": "Step Inspection Rules", "description": "The available Rules for Inspection are listed in the next table, with the Rule Name in the first column and the corresponding Inspection Severity direction in the two other columns:", "security": [], "preconditions": [], "steps": []}, "TerminateStep": {"type": "operation", "title": "Terminate Step", "description": "\ud83d\udd12 Step.Terminate", "security": ["Step.Terminate Overview#"], "preconditions": [], "steps": []}, "UnterminateStep": {"type": "operation", "title": "Unterminate Step", "description": "\ud83d\udd12 Step.Unterminate", "security": ["Step.Unterminate Overview#"], "preconditions": [], "steps": []}}
        };
        let network = null;
        function initNetwork() {
            const container = document.getElementById('networkContainer');
            const nodes = [];
            const edges = [];
            Object.keys(ontologyData.classes).forEach(id => {
                const cls = ontologyData.classes[id];
                let color = '#8b5cf6';
                let shadowColor = 'rgba(139, 92, 246, 0.4)';
                let size = 25;
                if (cls.type === 'related') {
                    color = '#10b981';
                    shadowColor = 'rgba(16, 185, 129, 0.3)';
                    size = 18;
                }
                nodes.push({
                    id: id, label: cls.title, shape: 'dot', size: size,
                    color: { background: color, border: 'rgba(255, 255, 255, 0.8)', highlight: { background: color, border: '#ffffff' } },
                    shadow: { enabled: true, color: shadowColor, size: 15, x: 0, y: 0 },
                    font: { color: '#ffffff', face: 'Plus Jakarta Sans', size: 12, strokeWidth: 0 }
                });
                if (cls.associations) {
                    cls.associations.forEach(assoc => {
                        edges.push({ from: id, to: assoc.target, label: assoc.label, color: { color: '#10b981' } });
                    });
                }
            });
            Object.keys(ontologyData.operations).forEach(id => {
                const op = ontologyData.operations[id];
                nodes.push({
                    id: id, label: op.title, shape: 'diamond', size: 16,
                    color: { background: '#f97316', border: 'rgba(255, 255, 255, 0.8)', highlight: { background: '#f97316', border: '#ffffff' } },
                    shadow: { enabled: true, color: 'rgba(249, 115, 22, 0.4)', size: 12, x: 0, y: 0 },
                    font: { color: '#ffffff', face: 'Plus Jakarta Sans', size: 11, strokeWidth: 0 }
                });
                edges.push({ from: id, to: 'Step', label: 'modifies', color: { color: '#f97316' } });
            });
            const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            const options = {
                physics: { barnesHut: { gravitationalConstant: -2000, centralGravity: 0.15, springLength: 120, springConstant: 0.04 }, stabilization: { iterations: 150 } },
                edges: { arrows: { to: { enabled: true, scaleFactor: 0.8 } }, font: { color: '#9ca3af', size: 9, face: 'Plus Jakarta Sans', strokeWidth: 2, strokeColor: '#080b11' }, color: { color: '#374151', highlight: '#ffffff' } },
                interaction: { hover: true, dragNodes: true, zoomView: true, dragView: true }
            };
            network = new vis.Network(container, data, options);
            network.on("selectNode", function (params) { inspectNode(params.nodes[0]); });
            inspectNode('Step');
        }
        function inspectNode(id) {
            const panel = document.getElementById('inspector');
            panel.innerHTML = '';
            let node = ontologyData.classes[id];
            let isOp = false;
            if (!node) { node = ontologyData.operations[id]; isOp = true; }
            if (!node) return;
            const badgeClass = isOp ? 'badge-operation' : (node.type === 'core_class' ? 'badge-core' : 'badge-related');
            const badgeText = isOp ? 'Transaction (Op)' : (node.type === 'core_class' ? 'Core Domain Class' : 'Domain Class');
            let headerHTML = `
                <div class="inspector-header">
                    <span class="node-type-badge ${badgeClass}">${badgeText}</span>
                    <h2 class="node-title">${node.title}</h2>
                </div>
                <p class="node-description">${node.description}</p>
            `;
            let bodyHTML = '';
            if (isOp) {
                let lockHTML = '';
                if (node.security && node.security.length > 0) {
                    lockHTML = `<div class="info-section"><h3 class="section-title">Security Privilege</h3><div class="op-meta-card">${node.security.map(sec => `<div class="op-lock">🔑 <span>${sec}</span></div>`).join('')}</div></div>`;
                }
                let preconditionHTML = '';
                if (node.preconditions && node.preconditions.length > 0) {
                    preconditionHTML = `<div class="info-section"><h3 class="section-title">State Preconditions</h3><ul style="list-style: none; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary);">${node.preconditions.map(pre => `<li style="background: rgba(239, 68, 68, 0.05); border-left: 3px solid #ef4444; padding: 0.5rem 0.75rem; border-radius: 4px;">${pre}</li>`).join('')}</ul></div>`;
                }
                let stepsHTML = '';
                if (node.steps && node.steps.length > 0) {
                    stepsHTML = `<div class="info-section"><h3 class="section-title">Workflow Steps</h3><ol style="margin-left: 1.25rem; font-size: 0.85rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 0.5rem;">${node.steps.map(step => `<li>${step}</li>`).join('')}</ol></div>`;
                }
                bodyHTML = lockHTML + preconditionHTML + stepsHTML;
            } else {
                let propertiesHTML = '';
                if (node.properties && node.properties.length > 0) {
                    propertiesHTML = `<div class="info-section"><h3 class="section-title">Data Properties</h3><div style="display: flex; flex-direction: column; gap: 0.5rem;">${node.properties.map(prop => `<div class="prop-item"><span class="prop-name">${prop.name}</span><span class="prop-val">${prop.value}</span></div>`).join('')}</div></div>`;
                }
                let associationsHTML = '';
                if (node.associations && node.associations.length > 0) {
                    associationsHTML = '<div class="info-section"><h3 class="section-title">Object Relationships</h3><div style="display: flex; flex-direction: column; gap: 0.5rem;">';
                    node.associations.forEach(assoc => {
                        let sentenceHTML = assoc.sentence ? `<span class="prop-val" style="display: block; margin-top: 0.25rem; font-size: 0.75rem; color: #6b7280; font-style: italic;">"${assoc.sentence}"</span>` : '';
                        associationsHTML += `
                            <div class="prop-item" style="border-left: 3px solid var(--accent-blue);">
                                <span class="prop-name">\${node.title} ➔ <span style="font-style: italic; color: #fb923c;">"\${assoc.label}"</span> ➔ <span style="color: var(--color-related);">\${assoc.target}</span></span>
                                <span class="prop-val">\${assoc.description}</span>
                                \${sentenceHTML}
                            </div>
                        `;
                    });
                    associationsHTML += '</div></div>';
                }
                bodyHTML = propertiesHTML + associationsHTML;
            }
            panel.innerHTML = headerHTML + bodyHTML;
        }
        window.onload = function() {
            try {
                if (typeof vis === 'undefined') { throw new Error("Vis.js failed to load locally."); }
                initNetwork();
            } catch (err) {
                console.error(err);
                document.getElementById('networkContainer').innerHTML = `<div style="padding: 2.5rem; color: #f87171; background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; margin: 2rem; font-family: monospace;"><h3>⚠️ Visualization failed to load</h3><p>\${err.message}</p></div>`;
            }
        };
    </script>
</body>
</html>
